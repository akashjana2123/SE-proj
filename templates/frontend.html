<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIU – Student Result Management System</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ───────────────────────────────────────────────
   ROOT & RESET
──────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink:       #0f1117;
  --ink2:      #3a3d4a;
  --ink3:      #7a7d8a;
  --paper:     #f8f6f1;
  --white:     #ffffff;
  --cream:     #faf9f6;
  --line:      #e5e2da;
  --accent:    #2563eb;
  --accent2:   #1d4ed8;
  --success:   #16a34a;
  --warning:   #d97706;
  --danger:    #dc2626;
  --admin-c:   #7c3aed;
  --faculty-c: #0891b2;
  --student-c: #059669;
  --r: 10px;
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.06);
  --shadow-lg: 0 8px 32px rgba(0,0,0,.12);
  --font-serif: 'DM Serif Display', Georgia, serif;
  --font-body: 'Outfit', sans-serif;
  --font-mono: 'DM Mono', monospace;
}

body {
  font-family: var(--font-body);
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
  font-size: 15px;
  line-height: 1.6;
}

/* ───────────────────────────────────────────────
   SCREENS
──────────────────────────────────────────────── */
.screen { display: none; min-height: 100vh; }
.screen.active { display: flex; flex-direction: column; }
#screen-login.active { flex-direction: row; align-items: center; justify-content: center; background: #fff; }

/* ───────────────────────────────────────────────
   LOGIN SCREEN
──────────────────────────────────────────────── */
#screen-login {
  background: #ffffff;
  flex-direction: row;
  align-items: stretch;
  justify-content: stretch;
  min-height: 100vh;
  padding: 0;
  overflow: hidden;
}

/* Left decorative panel */
.login-panel-left {
  flex: 1;
  background: var(--accent);
  background: linear-gradient(145deg, #1e40af 0%, #2563eb 50%, #3b82f6 100%);
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: flex-end;
  padding: 56px 52px;
  position: relative;
  overflow: hidden;
  min-width: 0;
}
.login-panel-left::before {
  content: '';
  position: absolute;
  width: 420px; height: 420px;
  border-radius: 50%;
  background: rgba(255,255,255,.07);
  top: -120px; right: -120px;
}
.login-panel-left::after {
  content: '';
  position: absolute;
  width: 280px; height: 280px;
  border-radius: 50%;
  background: rgba(255,255,255,.05);
  bottom: 80px; right: 40px;
}
.lpl-tag {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: rgba(255,255,255,.55);
  background: rgba(255,255,255,.1);
  border: 1px solid rgba(255,255,255,.15);
  padding: 5px 12px;
  border-radius: 20px;
  margin-bottom: 28px;
  display: inline-block;
}
.lpl-heading {
  font-family: var(--font-serif);
  font-size: 40px;
  line-height: 1.15;
  color: #fff;
  letter-spacing: -.02em;
  margin-bottom: 16px;
  max-width: 340px;
}
.lpl-sub {
  font-size: 14px;
  color: rgba(255,255,255,.6);
  line-height: 1.7;
  max-width: 320px;
  margin-bottom: 36px;
}
.lpl-features {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.lpl-feat {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  color: rgba(255,255,255,.75);
}
.lpl-feat-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: rgba(255,255,255,.5);
  flex-shrink: 0;
}

/* Right form panel */
.login-panel-right {
  width: 460px;
  flex-shrink: 0;
  background: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 48px 48px;
  border-left: 1px solid var(--line);
  position: relative;
}

.login-card {
  width: 100%;
  max-width: 360px;
}

.login-logo {
  margin-bottom: 32px;
}
.login-logo .logo-mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 48px; height: 48px;
  background: var(--accent);
  border-radius: 12px;
  font-size: 22px;
  margin-bottom: 14px;
  box-shadow: 0 4px 14px rgba(37,99,235,.3);
}
.login-logo h1 {
  font-family: var(--font-serif);
  font-size: 24px;
  color: var(--ink);
  letter-spacing: -.02em;
  margin-bottom: 4px;
}
.login-logo p {
  font-size: 13px;
  color: var(--ink3);
  font-family: var(--font-mono);
  letter-spacing: .03em;
}

.role-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 5px;
  margin-bottom: 24px;
  background: var(--cream);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 4px;
}
.role-tab {
  padding: 8px 6px;
  border-radius: 7px;
  border: none;
  background: transparent;
  color: var(--ink3);
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all .2s;
  text-align: center;
}
.role-tab.active {
  background: var(--white);
  color: var(--accent);
  box-shadow: 0 1px 4px rgba(0,0,0,.1);
  font-weight: 600;
}
.role-tab:hover:not(.active) { color: var(--ink2); background: rgba(0,0,0,.03); }

.form-group { margin-bottom: 16px; }
.form-group label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .05em;
  text-transform: uppercase;
  color: var(--ink3);
  margin-bottom: 6px;
  font-family: var(--font-mono);
}
.form-group input {
  width: 100%;
  background: var(--white);
  border: 1.5px solid var(--line);
  border-radius: 9px;
  padding: 11px 14px;
  font-family: var(--font-body);
  font-size: 14.5px;
  color: var(--ink);
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}
.form-group input::placeholder { color: #c4c4c4; }
.form-group input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(37,99,235,.1);
}

.btn-primary {
  width: 100%;
  padding: 12px;
  background: var(--accent);
  border: none;
  border-radius: 9px;
  color: #fff;
  font-family: var(--font-body);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s;
  box-shadow: 0 2px 10px rgba(37,99,235,.3);
  margin-top: 4px;
}
.btn-primary:hover { background: var(--accent2); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(37,99,235,.4); }
.btn-primary:active { transform: none; }

.login-error {
  background: #fef2f2;
  border: 1px solid #fecaca;
  border-radius: 8px;
  padding: 10px 14px;
  color: var(--danger);
  font-size: 13px;
  margin-bottom: 14px;
  display: none;
}

/* Hide left panel on small screens */
@media (max-width: 720px) {
  .login-panel-left { display: none; }
  .login-panel-right { width: 100%; border-left: none; }
}

/* ───────────────────────────────────────────────
   APP SHELL
──────────────────────────────────────────────── */
#screen-app {
  flex-direction: row;
  min-height: 100vh;
}

/* SIDEBAR */
.sidebar {
  width: 240px;
  flex-shrink: 0;
  background: var(--ink);
  display: flex;
  flex-direction: column;
  padding: 0;
  position: fixed;
  height: 100vh;
  overflow-y: auto;
  z-index: 100;
}

.sidebar-logo {
  padding: 22px 22px 18px;
  border-bottom: 1px solid rgba(255,255,255,.07);
}
.sidebar-logo .logo-row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.sidebar-logo .logo-icon {
  width: 34px; height: 34px;
  background: var(--accent);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}
.sidebar-logo .logo-text {
  font-family: var(--font-serif);
  font-size: 16px;
  color: #fff;
  letter-spacing: -.01em;
}
.sidebar-logo .logo-sub {
  font-family: var(--font-mono);
  font-size: 9.5px;
  color: rgba(255,255,255,.3);
  letter-spacing: .06em;
  margin-top: 2px;
  text-transform: uppercase;
}

.sidebar-user {
  padding: 14px 18px;
  margin: 12px;
  background: rgba(255,255,255,.04);
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,.07);
}
.sidebar-user .user-role {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: .1em;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.sidebar-user .user-name {
  font-size: 13.5px;
  font-weight: 600;
  color: #fff;
}
.sidebar-user .user-email {
  font-size: 11.5px;
  color: rgba(255,255,255,.35);
  font-family: var(--font-mono);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sidebar-nav { flex: 1; padding: 8px 10px; }
.nav-section-label {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: rgba(255,255,255,.25);
  padding: 12px 10px 6px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-radius: 8px;
  color: rgba(255,255,255,.55);
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
  transition: all .15s;
  margin-bottom: 1px;
  border: none;
  background: transparent;
  width: 100%;
  text-align: left;
}
.nav-item:hover { background: rgba(255,255,255,.06); color: rgba(255,255,255,.85); }
.nav-item.active { background: var(--accent); color: #fff; box-shadow: 0 2px 8px rgba(37,99,235,.3); }
.nav-item .nav-icon { font-size: 16px; width: 20px; text-align: center; flex-shrink: 0; }

.sidebar-footer {
  padding: 12px 10px;
  border-top: 1px solid rgba(255,255,255,.07);
}
.btn-logout {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 12px;
  border-radius: 8px;
  color: rgba(255,255,255,.45);
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
  transition: all .15s;
  border: none;
  background: transparent;
  width: 100%;
}
.btn-logout:hover { background: rgba(220,38,38,.12); color: #fca5a5; }

/* MAIN CONTENT */
.main-content {
  flex: 1;
  margin-left: 240px;
  background: var(--paper);
  min-height: 100vh;
}

.topbar {
  background: var(--white);
  border-bottom: 1px solid var(--line);
  padding: 0 32px;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 50;
}
.topbar-title {
  font-family: var(--font-serif);
  font-size: 20px;
  color: var(--ink);
  letter-spacing: -.02em;
}
.topbar-right { display: flex; align-items: center; gap: 12px; }
.topbar-badge {
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 4px 10px;
  border-radius: 20px;
  font-weight: 500;
  letter-spacing: .04em;
}
.badge-admin   { background: rgba(124,58,237,.1); color: var(--admin-c); }
.badge-faculty { background: rgba(8,145,178,.1);  color: var(--faculty-c); }
.badge-student { background: rgba(5,150,105,.1);  color: var(--student-c); }

.page-body { padding: 28px 32px; }

/* ───────────────────────────────────────────────
   DASHBOARD CARDS
──────────────────────────────────────────────── */
.dashboard-welcome {
  margin-bottom: 28px;
}
.dashboard-welcome h2 {
  font-family: var(--font-serif);
  font-size: 28px;
  letter-spacing: -.02em;
  color: var(--ink);
  margin-bottom: 4px;
}
.dashboard-welcome p { color: var(--ink3); font-size: 14px; }

.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px;
  margin-bottom: 28px;
}
.stat-card {
  background: var(--white);
  border-radius: var(--r);
  padding: 20px;
  box-shadow: var(--shadow);
  border: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.stat-card .stat-icon {
  width: 38px; height: 38px;
  border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  margin-bottom: 4px;
}
.stat-card .stat-value {
  font-family: var(--font-mono);
  font-size: 26px;
  font-weight: 500;
  color: var(--ink);
  line-height: 1;
}
.stat-card .stat-label {
  font-size: 12.5px;
  color: var(--ink3);
  font-weight: 500;
}
.si-blue   { background: rgba(37,99,235,.1);  color: var(--accent); }
.si-green  { background: rgba(22,163,74,.1);  color: var(--success); }
.si-purple { background: rgba(124,58,237,.1); color: var(--admin-c); }
.si-amber  { background: rgba(217,119,6,.1);  color: var(--warning); }
.si-teal   { background: rgba(8,145,178,.1);  color: var(--faculty-c); }

/* ───────────────────────────────────────────────
   PANELS / PAGES
──────────────────────────────────────────────── */
.panel { display: none; }
.panel.active { display: block; }

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}
.section-header h3 {
  font-family: var(--font-serif);
  font-size: 20px;
  letter-spacing: -.02em;
}

/* Table */
.table-wrap {
  background: var(--white);
  border-radius: var(--r);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  overflow: hidden;
}
table {
  width: 100%;
  border-collapse: collapse;
}
thead { background: var(--ink); }
thead th {
  padding: 12px 16px;
  text-align: left;
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: rgba(255,255,255,.6);
}
tbody tr { border-bottom: 1px solid var(--line); transition: background .1s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: var(--cream); }
tbody td {
  padding: 12px 16px;
  font-size: 13.5px;
  color: var(--ink2);
}
.td-bold { font-weight: 600; color: var(--ink); }

/* Badges */
.badge {
  display: inline-flex;
  align-items: center;
  padding: 3px 9px;
  border-radius: 20px;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: .04em;
}
.b-green   { background: rgba(22,163,74,.1);  color: var(--success); }
.b-amber   { background: rgba(217,119,6,.1);  color: var(--warning); }
.b-blue    { background: rgba(37,99,235,.1);  color: var(--accent);  }
.b-red     { background: rgba(220,38,38,.1);  color: var(--danger);  }
.b-purple  { background: rgba(124,58,237,.1); color: var(--admin-c); }
.b-gray    { background: rgba(0,0,0,.06);     color: var(--ink3);    }

/* Buttons */
.btn {
  padding: 8px 16px;
  border-radius: 8px;
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all .15s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn-blue   { background: var(--accent); color: #fff; }
.btn-blue:hover { background: var(--accent2); }
.btn-green  { background: var(--success); color: #fff; }
.btn-green:hover { background: #15803d; }
.btn-red    { background: var(--danger); color: #fff; }
.btn-red:hover { background: #b91c1c; }
.btn-ghost  { background: transparent; color: var(--ink2); border: 1.5px solid var(--line); }
.btn-ghost:hover { background: var(--cream); }
.btn-sm { padding: 5px 11px; font-size: 12px; }

/* Cards */
.card {
  background: var(--white);
  border-radius: var(--r);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
}
.card-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--line);
  font-weight: 600;
  font-size: 14px;
  color: var(--ink);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.card-body { padding: 20px; }

/* Form elements */
.field-row { display: grid; gap: 14px; margin-bottom: 14px; }
.fr-2 { grid-template-columns: 1fr 1fr; }
.fr-3 { grid-template-columns: 1fr 1fr 1fr; }
.field label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: var(--ink3);
  margin-bottom: 6px;
  font-family: var(--font-mono);
}
.field input, .field select {
  width: 100%;
  padding: 9px 12px;
  border: 1.5px solid var(--line);
  border-radius: 8px;
  font-family: var(--font-body);
  font-size: 14px;
  color: var(--ink);
  background: var(--white);
  outline: none;
  transition: border-color .15s;
}
.field input:focus, .field select:focus { border-color: var(--accent); }

/* Marks input table */
.marks-table td input {
  width: 80px;
  padding: 6px 8px;
  border: 1.5px solid var(--line);
  border-radius: 6px;
  font-family: var(--font-mono);
  font-size: 13px;
  text-align: center;
  outline: none;
}
.marks-table td input:focus { border-color: var(--accent); }

/* Result Card */
.result-card {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  max-width: 720px;
}
.result-card-header {
  background: var(--ink);
  padding: 28px 32px;
  color: #fff;
}
.result-card-header h2 {
  font-family: var(--font-serif);
  font-size: 22px;
  letter-spacing: -.02em;
  margin-bottom: 2px;
}
.result-card-header p { color: rgba(255,255,255,.5); font-size: 13px; font-family: var(--font-mono); }

.result-meta {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
  padding: 20px 32px;
  border-bottom: 1px solid var(--line);
  background: var(--cream);
}
.result-meta-item { text-align: center; padding: 8px 0; }
.result-meta-item .rm-val {
  font-family: var(--font-mono);
  font-size: 18px;
  font-weight: 500;
  color: var(--ink);
}
.result-meta-item .rm-label {
  font-size: 11px;
  color: var(--ink3);
  text-transform: uppercase;
  letter-spacing: .05em;
  font-family: var(--font-mono);
  margin-top: 3px;
}

/* SGPA display */
.sgpa-display {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 32px;
  padding: 24px 32px;
  border-bottom: 1px solid var(--line);
}
.gpa-circle {
  width: 88px; height: 88px;
  border-radius: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 3px solid var(--accent);
  background: rgba(37,99,235,.05);
}
.gpa-circle .gpa-val {
  font-family: var(--font-mono);
  font-size: 22px;
  font-weight: 500;
  color: var(--accent);
  line-height: 1;
}
.gpa-circle .gpa-label {
  font-size: 10px;
  color: var(--ink3);
  letter-spacing: .06em;
  margin-top: 3px;
}
.status-pill {
  padding: 8px 22px;
  border-radius: 30px;
  font-weight: 700;
  font-size: 14px;
  letter-spacing: .04em;
}
.sp-pass { background: rgba(22,163,74,.12); color: var(--success); }
.sp-fail { background: rgba(220,38,38,.12); color: var(--danger); }

/* Alert */
.alert {
  padding: 12px 16px;
  border-radius: 9px;
  font-size: 13.5px;
  margin-bottom: 16px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.alert-info    { background: rgba(37,99,235,.08); border-left: 3px solid var(--accent); color: var(--accent2); }
.alert-success { background: rgba(22,163,74,.08); border-left: 3px solid var(--success); color: #15803d; }
.alert-warning { background: rgba(217,119,6,.08); border-left: 3px solid var(--warning); color: var(--warning); }

/* Step indicator */
.steps {
  display: flex;
  align-items: center;
  gap: 0;
  margin-bottom: 24px;
}
.step {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink3);
}
.step-num {
  width: 26px; height: 26px;
  border-radius: 50%;
  border: 2px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
}
.step.done .step-num { background: var(--success); border-color: var(--success); color: #fff; }
.step.active .step-num { background: var(--accent); border-color: var(--accent); color: #fff; }
.step.active { color: var(--ink); }
.step-line { flex: 1; height: 2px; background: var(--line); margin: 0 8px; min-width: 20px; }
.step-line.done { background: var(--success); }

/* Change password */
.pwd-strength { margin-top: 6px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.pwd-strength-bar { height: 100%; border-radius: 2px; transition: width .3s, background .3s; }

/* Toast */
.toast-wrap {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.toast {
  background: var(--ink);
  color: #fff;
  padding: 12px 18px;
  border-radius: 10px;
  font-size: 13.5px;
  box-shadow: 0 8px 30px rgba(0,0,0,.25);
  display: flex;
  align-items: center;
  gap: 10px;
  animation: slideUp .3s ease;
  max-width: 320px;
}
.toast-success { border-left: 3px solid var(--success); }
.toast-error   { border-left: 3px solid var(--danger); }
.toast-info    { border-left: 3px solid var(--accent); }

@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Modal */
.modal-bg {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.5);
  backdrop-filter: blur(4px);
  z-index: 500;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-bg.open { display: flex; }
.modal {
  background: var(--white);
  border-radius: 14px;
  width: 100%;
  max-width: 480px;
  box-shadow: 0 24px 80px rgba(0,0,0,.25);
  overflow: hidden;
}
.modal-header {
  padding: 20px 24px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-header h3 { font-weight: 700; font-size: 16px; }
.modal-close {
  width: 28px; height: 28px;
  border-radius: 6px;
  border: none;
  background: var(--cream);
  cursor: pointer;
  font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  color: var(--ink3);
}
.modal-close:hover { background: var(--line); }
.modal-body { padding: 22px 24px; }
.modal-footer { padding: 16px 24px; border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: flex-end; }

/* Empty state */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--ink3);
}
.empty-state .es-icon { font-size: 40px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; }

/* Workflow status */
.workflow {
  display: flex;
  align-items: center;
  gap: 0;
  padding: 18px 0;
}
.wf-step {
  flex: 1;
  text-align: center;
  position: relative;
}
.wf-dot {
  width: 32px; height: 32px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 6px;
  font-size: 14px;
  font-weight: 700;
}
.wf-dot.done    { background: var(--success); color: #fff; }
.wf-dot.current { background: var(--accent); color: #fff; box-shadow: 0 0 0 4px rgba(37,99,235,.2); }
.wf-dot.pending { background: var(--line); color: var(--ink3); }
.wf-label { font-size: 11px; color: var(--ink3); font-family: var(--font-mono); }
.wf-line {
  position: absolute;
  top: 16px;
  left: 50%;
  width: 100%;
  height: 2px;
  background: var(--line);
  z-index: -1;
}
.wf-line.done { background: var(--success); }
</style>
</head>

      </div>
      <div class="field" style="margin-bottom:20px">

        <input type="password" placeholder="Re-enter new password" id="cpConfirm">

      </div>
    </div>
  </div>`;
}
function checkStrength(el) {
  const v = el.value;
  const bar = document.getElementById('strengthBar');
  if (!bar) return;
  let score = 0;
  if (v.length >= 8) score++;
  if (/[A-Z]/.test(v)) score++;
  if (/[0-9]/.test(v)) score++;
  if (/[^A-Za-z0-9]/.test(v)) score++;
  const w = [0,25,50,75,100][score];
  const c = ['','var(--danger)','var(--warning)','var(--warning)','var(--success)'][score];
  bar.style.width = w + '%';
  bar.style.background = c;
}
function changePassword() {
  const old = document.getElementById('cpOld')?.value;
  const n = document.getElementById('cpNew')?.value;
  const c = document.getElementById('cpConfirm')?.value;
  if (!old) { showToast('⚠️ Enter current password', 'error'); return; }
  if (n !== c) { showToast('⚠️ Passwords do not match', 'error'); return; }
  if (n && n.length < 8) { showToast('⚠️ Password must be at least 8 characters', 'error'); return; }
  showToast('✅ Password updated successfully (200 OK)', 'success');
}

  openModal('Confirm Deletion',
    `<div class="alert alert-warning">⚠️ Are you sure you want to delete this ${type}? This action cannot be undone.</div>`,
    [{ label:'Cancel', cls:'btn-ghost', action:'closeModal()' },{ label:'Delete', cls:'btn-red', action:`doDelete('${type}','${id}')` }]
  );
}
function showAddBacklogModal() {
  openModal('Add Student Backlog',
    `<div class="field-row"><div class="field"><label>Student</label><select><option>Rahul Dey (CS2104)</option><option>Meena Ghosh (CS2105)</option></select></div></div><div class="field-row fr-2"><div class="field"><label>Subject</label><select>${SUBJECTS.map(s=>`<option>${s.code} – ${s.name}</option>`).join('')}</select></div><div class="field"><label>Academic Year</label><select><option>2024–25</option><option>2023–24</option></select></div></div>`,
    [{ label:'Cancel', cls:'btn-ghost', action:'closeModal()' },{ label:'Add Backlog', cls:'btn-blue', action:"saveItem('backlog')" }]
  );
}
function openModal(title, bodyHtml, buttons) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modalFooter').innerHTML = buttons.map(b=>
    `<button class="btn ${b.cls}" onclick="${b.action}">${b.label}</button>`
  ).join('');
  document.getElementById('modalBg').classList.add('open');
}
function closeModal() { document.getElementById('modalBg').classList.remove('open'); }
function saveItem(type) { closeModal(); showToast('✅ Record saved successfully.', 'success'); }
function doDelete(type, id) { closeModal(); showToast('🗑 Record deleted.', 'success'); }

/* ─────────────────────────────────────────────
   TOAST
───────────────────────────────────────────── */
function showToast(msg, type='info') {
  const wrap = document.getElementById('toastWrap');
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(() => { t.style.opacity='0'; t.style.transition='opacity .4s'; setTimeout(()=>t.remove(), 400); }, 3500);
}

/* close modal on bg click */
document.getElementById('modalBg').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

/* Enter key on login */
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && document.getElementById('screen-login').classList.contains('active')) doLogin();
});
</script>
